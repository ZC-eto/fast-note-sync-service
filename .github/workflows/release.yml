name: Release Service

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: zc-eto/fast-note-sync-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          SOURCE_VERSION="$(sed -n 's/^[[:space:]]*Version[[:space:]]*string[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' internal/app/version.go)"
          test -n "$SOURCE_VERSION"
          test "$VERSION" = "$SOURCE_VERSION"
      - run: go test ./...
      - run: go vet ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          BINARY=fast-note-sync-service
          if [ "$GOOS" = windows ]; then BINARY="${BINARY}.exe"; fi
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          GIT_COMMIT="$(git rev-parse --short=12 HEAD)"
          go build -trimpath -ldflags="-s -w -X github.com/haierkeys/fast-note-sync-service/internal/app.Version=${VERSION} -X github.com/haierkeys/fast-note-sync-service/internal/app.GitTag=${GIT_COMMIT} -X github.com/haierkeys/fast-note-sync-service/internal/app.BuildTime=${BUILD_DATE}" -o "$BINARY" .
          tar -czf "fast-note-sync-service-${VERSION}-${GOOS}-${GOARCH}.tar.gz" "$BINARY"
      - uses: actions/upload-artifact@v7
        with:
          name: service-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "fast-note-sync-service-*.tar.gz"

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: service-*
          merge-multiple: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: "fast-note-sync-service-*.tar.gz"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "fast-note-sync-service-*.tar.gz"

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dokploy
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
