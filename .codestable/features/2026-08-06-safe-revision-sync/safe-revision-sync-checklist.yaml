feature: 2026-08-06-safe-revision-sync
created: 2026-08-06

steps:
  - id: S1
    action: "验证基线：统一插件测试入口并修复现有同步测试的不可归因失败"
    exit_signal: "pnpm test 可以一次运行三个现有测试且结果可归因"
    status: done
  - id: S2
    action: "领域与持久化：建立 PostgreSQL per-user Resource/Vault Revision、PathTombstone、UoW、staging/recovery、操作日志、SQLite 用户库导入和可重入迁移"
    exit_signal: "SQLite fixture 到 PostgreSQL 的 dry-run/重复导入校验，以及临时数据库与文件系统故障注入证明回填、事务、PREPARED 恢复、原子递增和 30 天终态幂等窗口"
    status: done
  - id: S3
    action: "协议编排：扩展 capability、status/bootstrap/events、创建与安全 mutation、附件 start/commit 和结构化错误"
    exit_signal: "OFF 保持旧行为；BOOTSTRAPPING 冻结写入；STRICT 的创建、附件 commit、事件分页和错误均可由协议测试观察"
    status: done
  - id: S4
    action: "服务端计算：通过 strict guard 与 coordinator 接管 STRICT/BOOTSTRAPPING 的所有逻辑写入口和递归资源操作"
    exit_signal: "顺序、冲突、重复操作、非 WebSocket 绕过、递归文件夹和目标路径冲突测试全部通过且无部分提交"
    status: done
  - id: S5
    action: "客户端状态：按 server/user/vault 双写设备/操作/修订基准，处理 bootstrap mismatch 与过期 pending，保护远端删除并建立恢复区"
    exit_signal: "ACK、断线重试、状态文件损坏、未知基准、mismatch、过期 pending、删除冲突和恢复区失败测试均有确定结果"
    status: done
  - id: S6
    action: "设置交互：加入默认关闭的安全多端同步 toggle、完整状态、strict 不降级确认和能力不可用反馈"
    exit_signal: "桌面与移动端可观察 disabled/unsupported/activating/bootstrapping/active/strict-vault-local-disabled/error，关闭仅暂停且无布局溢出"
    status: done
  - id: S7
    action: "兼容与加固：完成 PostgreSQL capability gate、新旧双端、写入口矩阵、PREPARED/服务重启、时钟偏差、分页中断和文档同步"
    exit_signal: "所有核心命令和 AC-01 至 AC-21 通过，无新增未说明回归"
    status: done
  - id: S8
    action: "自用发布：构建 fork 服务，备份 SQLite/config/storage，导入并切换 Dokploy 公用 PostgreSQL，更新 Obsidian 插件和执行复制 Vault smoke"
    exit_signal: "服务健康、PostgreSQL 迁移校验通过、插件版本一致、AC-15/AC-16/AC-21 有证据且回滚点可用"
    status: pending

checks:
  - id: C1
    item: "Resource 当前状态唯一，旧路径使用 PathTombstone；Resource ID 稳定且 Resource Revision 与 Note.Version 分离"
    source: 名词契约
    status: pending
  - id: C2
