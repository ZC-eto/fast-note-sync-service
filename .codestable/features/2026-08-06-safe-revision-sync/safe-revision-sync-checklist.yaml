  - id: C6
    item: "严格 Vault 不因单台设备关闭本地设置而降级"
    source: 流程级约束
    status: pending
  - id: C7
    item: "本阶段不包含权威镜像、设备角色、.obsidian 同步或上游 PR"
    source: 范围守护
    status: pending
  - id: C8
    item: "AC-01 至 AC-21 均有可观察证据"
    source: 验收场景
    status: pending
  - id: C9
    item: "Dokploy 使用 fork 构建，storage/config/staging 持久化、备份并有可验证回滚点"
    source: 挂载点
    status: pending
  - id: C10
    item: "本机 Obsidian 插件产物、manifest 版本和加载版本一致"
    source: 验收场景
    status: pending
  - id: C11
    item: "创建使用 absent/0 前置条件并由服务端分配 Resource ID；附件只有 commit 校验 hash 后产生 revision"
    source: 协议契约
    status: pending
  - id: C12
    item: "首次激活通过带过期 session 的 OFF -> BOOTSTRAPPING -> STRICT CAS，mismatch 或失败不提交"
    source: 编排骨架
    status: pending
  - id: C13
    item: "PREPARED 崩溃恢复完成提交或恢复 old-image，未 COMMITTED 不 ACK、不广播"
    source: 流程级约束
    status: pending
  - id: C14
    item: "客户端状态绑定 serverFingerprint + uid + vaultId 并双写；过期 pending 不重发"
    source: 客户端持久化契约
    status: pending
  - id: C15
    item: "旧 WebSocket、REST、MCP、Git sync 和回收站恢复不能绕过严格 Vault"
    source: 严格写入守卫
    status: pending
  - id: C16
    item: "安全修订 capability 仅在 PostgreSQL 用户库且 SQLite 导入校验完成后可用；导入可重入、保留主键并可回滚"
    source: PostgreSQL 部署前提
    status: pending

